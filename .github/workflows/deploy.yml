name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kun-auto-chatbot

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kun-auto-chatbot/package-lock.json

      - name: Install dependencies
        run: npm install --frozen-lockfile 2>/dev/null || npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Type check
        run: npm run check

