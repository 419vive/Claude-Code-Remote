      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ── Docker + VPS deploy (uncomment if using your own server) ─────────
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
