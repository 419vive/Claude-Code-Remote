name: GEO/SEO Audit (Every 3 Days)

on:
  schedule:
    # Runs every 3 days at 03:00 UTC (11:00 Taiwan time)
    - cron: '0 3 */3 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  contents: read

env:
  SITE_URL: https://www.kunjia-autos.com
  SITE_NAME: 崑家汽車

jobs:
  schema-audit:
    name: Schema Markup Validation
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.schema.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON-LD schemas
        id: schema
        run: |
          REPORT=""
          PAGES=(
            "/"
            "/area/kaohsiung"
            "/area/pingtung"
            "/area/tainan"
            "/area/taichung"
            "/area/taipei"
            "/area/hsinchu"
            "/area/chiayi"
            "/area/yunlin"
            "/area/changhua"
            "/area/nantou"
            "/area/taitung"
            "/area/hualien"
          )

          for page in "${PAGES[@]}"; do
            URL="${SITE_URL}${page}"
            echo "Checking: $URL"

            # Fetch page and extract JSON-LD
            HTTP_CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" "$URL" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              # Count JSON-LD blocks
              LD_COUNT=$(grep -c 'application/ld+json' /tmp/page.html 2>/dev/null || echo "0")
              REPORT="${REPORT}| \`${page}\` | ${HTTP_CODE} | ${LD_COUNT} blocks |"$'\n'
            else
              REPORT="${REPORT}| \`${page}\` | ${HTTP_CODE} | ⚠️ UNREACHABLE |"$'\n'
            fi
          done

          # Save multi-line output
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  lighthouse-audit:
    name: Core Web Vitals (Lighthouse)
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.lighthouse.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse on key pages
        id: lighthouse
        run: |
          REPORT=""
          PAGES=("/" "/area/kaohsiung" "/area/tainan" "/area/taipei")

          for page in "${PAGES[@]}"; do
            URL="${SITE_URL}${page}"
            echo "Auditing: $URL"

            # Run lighthouse (JSON output)
            lhci collect --url="$URL" --settings.output=json \
              --settings.onlyCategories=performance,seo,accessibility \
              2>/dev/null || true

            # Parse latest result
            RESULT_FILE=$(ls -t .lighthouseci/lhr-*.json 2>/dev/null | head -1)
            if [ -n "$RESULT_FILE" ]; then
              PERF=$(jq -r '.categories.performance.score * 100 | floor' "$RESULT_FILE" 2>/dev/null || echo "N/A")
              SEO=$(jq -r '.categories.seo.score * 100 | floor' "$RESULT_FILE" 2>/dev/null || echo "N/A")
              A11Y=$(jq -r '.categories.accessibility.score * 100 | floor' "$RESULT_FILE" 2>/dev/null || echo "N/A")
              FCP=$(jq -r '.audits["first-contentful-paint"].displayValue' "$RESULT_FILE" 2>/dev/null || echo "N/A")
              LCP=$(jq -r '.audits["largest-contentful-paint"].displayValue' "$RESULT_FILE" 2>/dev/null || echo "N/A")
              CLS=$(jq -r '.audits["cumulative-layout-shift"].displayValue' "$RESULT_FILE" 2>/dev/null || echo "N/A")

              REPORT="${REPORT}| \`${page}\` | ${PERF} | ${SEO} | ${A11Y} | ${FCP} | ${LCP} | ${CLS} |"$'\n'
            else
              REPORT="${REPORT}| \`${page}\` | ⚠️ | ⚠️ | ⚠️ | - | - | - |"$'\n'
            fi
          done

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  ai-citation-check:
    name: AI Citation & Discoverability
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.citations.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AI discoverability signals
        id: citations
        run: |
          REPORT=""

          # Check robots.txt for AI crawler access
          ROBOTS=$(curl -s "${SITE_URL}/robots.txt" 2>/dev/null || echo "NOT FOUND")
          AI_BOTS=("GPTBot" "ChatGPT-User" "Google-Extended" "Anthropic" "ClaudeBot" "PerplexityBot")

          REPORT="${REPORT}### AI Crawler Access (robots.txt)"$'\n'
          for bot in "${AI_BOTS[@]}"; do
            if echo "$ROBOTS" | grep -qi "$bot"; then
              if echo "$ROBOTS" | grep -qi "Disallow.*$bot\|User-agent: $bot" | grep -qi "Disallow: /"; then
                REPORT="${REPORT}- ❌ \`${bot}\`: Blocked"$'\n'
              else
                REPORT="${REPORT}- ✅ \`${bot}\`: Allowed"$'\n'
              fi
            else
              REPORT="${REPORT}- ✅ \`${bot}\`: Not restricted (default allow)"$'\n'
            fi
          done

          # Check for AI citability blocks
          REPORT="${REPORT}"$'\n'"### AI Citability Blocks"$'\n'
          HOME_HTML=$(curl -s "${SITE_URL}/" 2>/dev/null || echo "")
          AI_SUMMARY=$(echo "$HOME_HTML" | grep -c 'data-ai-summary' 2>/dev/null || echo "0")
          ANSWER_SUMMARY=$(echo "$HOME_HTML" | grep -c 'answer-summary\|data-paa' 2>/dev/null || echo "0")
          REPORT="${REPORT}- Homepage: ${AI_SUMMARY} ai-summary blocks, ${ANSWER_SUMMARY} PAA blocks"$'\n'

          # Check sitemap accessibility
          SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/sitemap.xml" 2>/dev/null || echo "000")
          REPORT="${REPORT}"$'\n'"### Sitemap"$'\n'
          REPORT="${REPORT}- Status: ${SITEMAP_CODE}"$'\n'

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  competitor-snapshot:
    name: Competitor Quick Check
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.competitors.outputs.report }}
    steps:
      - name: Check competitor signals
        id: competitors
        run: |
          REPORT=""
          COMPETITORS=(
            "HOT大聯盟|https://www.hotcar.com.tw"
            "SUM優質車商|https://www.sum.com.tw"
          )

          for entry in "${COMPETITORS[@]}"; do
            IFS='|' read -r NAME URL <<< "$entry"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            HAS_JSONLD=$(curl -s "$URL" 2>/dev/null | grep -c 'application/ld+json' || echo "0")
            REPORT="${REPORT}| ${NAME} | ${HTTP_CODE} | ${HAS_JSONLD} JSON-LD blocks |"$'\n'
          done

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  post-report:
    name: Post Audit Report
    needs: [schema-audit, lighthouse-audit, ai-citation-check, competitor-snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue with report
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            const body = `## 🔍 GEO/SEO 自動審計報告 — ${today}

            ### 1. Schema Markup 驗證

            | 頁面 | HTTP | JSON-LD |
            |------|------|---------|
            ${{ needs.schema-audit.outputs.report }}

            ### 2. Core Web Vitals (Lighthouse)

            | 頁面 | Performance | SEO | Accessibility | FCP | LCP | CLS |
            |------|-------------|-----|---------------|-----|-----|-----|
            ${{ needs.lighthouse-audit.outputs.report }}

            ### 3. AI 引用與可發現性

            ${{ needs.ai-citation-check.outputs.report }}

            ### 4. 競品快照

            | 競品 | HTTP | Schema |
            |------|------|--------|
            ${{ needs.competitor-snapshot.outputs.report }}

            ---
            *自動產生 by GEO/SEO Audit Workflow · 每三天執行一次*
            *結果可作為 OpenSpace 技能記憶存入，供下次優化參考*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[GEO/SEO 審計] ${today} 自動報告`,
              body: body,
              labels: ['geo-seo-audit', 'automated']
            });
